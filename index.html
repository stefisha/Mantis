<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantis AI PDF Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Team</a></li>
        <li><a href="#">Mantis</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1>Mantis AI PDF Chat</h1>

    <div class="upload-section">
      <label for="pdf-upload">Upload a PDF:</label>
      <input type="file" id="pdf-upload" accept=".pdf">
      <button onclick="uploadPDF()">Upload</button>
      <p id="upload-status"></p>
    </div>

    <div class="clear-section">
      <button onclick="clearPDFs()">Clear PDFs in Memory</button>
      <p id="clear-status"></p>
    </div>

    <div class="chat-section">
      <label for="query">Ask a question:</label>
      <textarea id="query" placeholder="Type your question here..."></textarea>
      <button onclick="askQuestion()">Ask</button>

      <div id="chat-history"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Powered by @stefisha & @peksi</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
