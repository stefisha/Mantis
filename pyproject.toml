[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis-maintenance"
version = "0.2.0"
description = "Document-grounded maintenance workspace"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.50,<3",
  "pdfplumber>=0.11,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.18,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.setuptools]
packages = ["mantis"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
