name: Bug report
description: Report a reproducible problem in the maintenance workspace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please omit API keys and private manual contents. Use a small synthetic PDF when possible."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the selected manual type and whether demo mode is enabled.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser, commit"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact secrets and private document contents.
